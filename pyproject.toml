[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-rashomon"
version = "0.1.0"
description = "Predictive multiplicity research pipeline for GNN node classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "networkx>=3.2",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "kagglehub>=0.3",
  "torch>=2.3,<2.6",
  "torch-geometric>=2.5",
  "ogb>=1.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["gnn_rashomon"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
